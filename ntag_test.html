<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ムシバトキンダム NTAGテスト</title><style>body{margin:0;background:#101827;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{width:min(92vw,700px);background:#1e293b;padding:28px;border-radius:22px;text-align:center}h1{margin:0 0 8px}p{color:#cbd5e1}button{width:100%;padding:16px;border:0;border-radius:14px;background:#eab308;font-size:22px;font-weight:900}#status{margin-top:18px;padding:16px;background:#0f172a;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.box{background:#334155;padding:14px;border-radius:12px;text-align:left}.label{font-size:13px;color:#cbd5e1}.value{font-size:21px;font-weight:900;word-break:break-all}.note{margin-top:18px;font-size:13px;color:#94a3b8;line-height:1.7}</style></head><body><div class="card"><h1>🪲 NTAG召喚テスト</h1><p>NTAG215をスマホにかざして読み取ります</p><button id="scan">📱 NTAGを読み取る</button><div id="status">準備完了</div><div class="grid"><div class="box"><div class="label">シリアル番号</div><div id="serial" class="value">---</div></div><div class="box"><div class="label">NDEFレコード</div><div id="ndef" class="value">---</div></div><div class="box"><div class="label">個体値テスト</div><div id="iv" class="value">---</div></div><div class="box"><div class="label">個体ランク</div><div id="rank" class="value">---</div></div></div><div class="note">Android版ChromeのWeb NFC対応環境を想定。<br>まず「タグを検出できるか」「シリアル番号が取得できるか」を確認します。</div></div><script>const $=id=>document.getElementById(id);function rank(v){if(v<50)return['並','+'+Math.floor(v/10)+'%'];if(v<75)return['優','+'+(5+Math.floor((v-50)/5))+'%'];if(v<90)return['秀','+'+(10+Math.floor((v-75)/3))+'%'];if(v<95)return['天賦','+17%'];return['極','+20%']}$("scan").onclick=async()=>{$("status").textContent='NTAGをスマホの背面にかざしてください…';if(!('NDEF'in window)){$("status").textContent='Web NFC非対応です。Android版Chromeで試してください。';return}try{const ndef=new NDEFReader();ndef.onreadingerror=()=>$("status").textContent='読み取り失敗。もう一度かざしてください。';ndef.onreading=event=>{const s=event.serialNumber||'';$("serial").textContent=s||'取得できず';const rec=[];for(const r of event.message.records){try{if(r.recordType==='text'){const dec=new TextDecoder(r.encoding||'utf-8');rec.push(dec.decode(r.data))}else if(r.recordType==='url'){rec.push(new TextDecoder().decode(r.data))}else rec.push(r.recordType)}catch(e){rec.push(r.recordType)}}$("ndef").textContent=rec.join(' / ')||'なし';if(s){const hex=s.replace(/[^0-9a-f]/gi,'');const v=parseInt(hex.slice(-2),16)%100;const [rr,b]=rank(v);$("iv").textContent=String(v).padStart(2,'0')+' ('+b+')';$("rank").textContent=rr;$("status").textContent='✅ 読み取り成功'}else $("status").textContent='タグは検出しましたがシリアル番号を取得できませんでした'};await ndef.scan()}catch(e){$("status").textContent='開始できません: '+(e.message||e)}};</script></body></html>
